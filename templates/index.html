{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Bot Widget</title>
    <link rel="stylesheet" href="{% static 'css/chat-widget.css' %}">
    
    <!-- =========================================================================== -->
    <!-- WEBSOCKET ADDED: Sunshine App ID configuration for WebSocket connection -->
    <!-- =========================================================================== -->
   
    
    <style>
        /* Basic page styling */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #555;
        }

        .welcome-text {
            text-align: center;
        }

        h1 {
            margin-bottom: 0.5rem;
            color: #333;
        }

        p {
            color: #666;
        }
    </style>
</head>
<body>

    <div class="welcome-text">
        <h1>Welcome to the Chat Bot Demo</h1>
        <p>Click the chat icon in the bottom right corner to interact.</p>
    </div>

    <!-- Chat Widget Container -->
    <div class="chat-widget">
        <!-- Chat Box (Hidden by default) -->
        <div class="chat-box">
            <!-- Header -->
            <div class="chat-header">
                <button class="chat-back-btn" aria-label="Back to conversations" style="display: none;">←</button>
                <span>Yatri Bandhu</span>
                <button class="chat-close-btn" aria-label="Close chat">✖</button>
            </div>
            
            <!-- Conversation List View (shown first) -->
            <div class="conversation-list-view">
                <div class="conversation-list">
                    <!-- Conversations will be populated here -->
                    <div class="no-conversations">
                        <div class="no-conv-icon">💬</div>
                        <p>No conversations yet</p>
                        <p class="no-conv-subtext">Start a new conversation to get help</p>
                    </div>
                </div>
                <div class="new-conversation-btn-container">
                    <button class="new-conversation-btn">+ New Conversation</button>
                </div>
            </div>
            
            <!-- Chat View (hidden initially) -->
            <div class="chat-view" style="display: none;">
                <!-- Messages Area -->
                <div class="chat-messages">
                    <!-- Messages will appear here -->
                </div>
                
                <!-- Input Area -->
                <div class="chat-input">
                    <input type="text" id="chat-input-field" placeholder="Type a message..." aria-label="Type a message">
                    <input type="file" id="file-input" accept=".pdf,.doc,.docx,.txt,.png,.jpg,.jpeg,.gif" style="display: none;">
                    <button id="file-attach-btn" aria-label="Attach file">
                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5c0-1.38 1.12-2.5 2.5-2.5s2.5 1.12 2.5 2.5v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V5c0-2.21-1.79-4-4-4S7 2.79 7 5v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6h-1.5z"/>
                        </svg>
                    </button>
                    <button id="chat-send-btn" aria-label="Send message">
                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- Toggle Button -->
        <button class="chat-toggle-btn" aria-label="Open chat">💬</button>
    </div>

    <script>
        window.issuesUrl = "{% static 'js/issues.json' %}";
    </script>
    <script src="{% static 'js/chat-widget.js' %}"></script>
</body>
</html>
